name: Build IslandBrowser

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE_PATH=$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort | tail -n 1)
          if [ -n "$XCODE_PATH" ]; then sudo xcode-select -s "$XCODE_PATH/Contents/Developer"; fi
          xcodebuild -version

      - name: Build unsigned archive
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project IslandBrowser.xcodeproj \
            -scheme IslandBrowser \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/IslandBrowser.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ARCHS=arm64 \
            | tee build/xcodebuild.log

      - name: Validate archived app
        run: |
          set -euo pipefail
          APP_PATH="build/IslandBrowser.xcarchive/Products/Applications/IslandBrowser.app"
          PLIST_PATH="$APP_PATH/Info.plist"
          EXECUTABLE_PATH="$APP_PATH/IslandBrowser"

          test -d "$APP_PATH" || { echo "ERROR: archived app not found at $APP_PATH"; exit 1; }
          test -f "$PLIST_PATH" || { echo "ERROR: archived Info.plist not found at $PLIST_PATH"; exit 1; }

          echo "/usr/libexec/PlistBuddy -c \"Print :CFBundleIdentifier\" $PLIST_PATH"
          BUNDLE_IDENTIFIER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST_PATH")
          echo "$BUNDLE_IDENTIFIER"
          echo "/usr/libexec/PlistBuddy -c \"Print :CFBundleExecutable\" $PLIST_PATH"
          BUNDLE_EXECUTABLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$PLIST_PATH")
          echo "$BUNDLE_EXECUTABLE"

          if [ -z "$BUNDLE_IDENTIFIER" ] || [[ "$BUNDLE_IDENTIFIER" == *'$('* ]] || [[ "$BUNDLE_IDENTIFIER" == *'%'* ]]; then
            echo "ERROR: CFBundleIdentifier is empty or unresolved: $BUNDLE_IDENTIFIER"
            exit 1
          fi
          if [ "$BUNDLE_EXECUTABLE" != "IslandBrowser" ]; then
            echo "ERROR: CFBundleExecutable must be IslandBrowser, got: $BUNDLE_EXECUTABLE"
            exit 1
          fi
          test -f "$EXECUTABLE_PATH" || { echo "ERROR: executable not found at $EXECUTABLE_PATH"; exit 1; }
          test -x "$EXECUTABLE_PATH" || { echo "ERROR: executable is not executable: $EXECUTABLE_PATH"; exit 1; }

          file "$EXECUTABLE_PATH"
          file "$EXECUTABLE_PATH" | grep -q 'Mach-O' || {
            echo "ERROR: $EXECUTABLE_PATH is not a Mach-O executable"
            exit 1
          }
          if command -v lipo >/dev/null 2>&1; then
            lipo -info "$EXECUTABLE_PATH"
          fi

      - name: Publish build diagnostics
        if: always()
        run: |
          if [ -f build/xcodebuild.log ]; then
            {
              echo '## xcodebuild diagnostics'
              echo '```text'
              tail -n 250 build/xcodebuild.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          rm -rf Payload IslandBrowser.ipa
          mkdir -p Payload
          cp -R build/IslandBrowser.xcarchive/Products/Applications/IslandBrowser.app Payload/IslandBrowser.app
          zip -qry IslandBrowser.ipa Payload

      - name: Validate unsigned IPA
        run: |
          set -euo pipefail
          rm -rf ipa-validation
          mkdir -p ipa-validation
          unzip -q IslandBrowser.ipa -d ipa-validation

          APP_PATH="ipa-validation/Payload/IslandBrowser.app"
          PLIST_PATH="$APP_PATH/Info.plist"
          EXECUTABLE_PATH="$APP_PATH/IslandBrowser"
          test -d "$APP_PATH" || { echo "ERROR: IPA app bundle missing at $APP_PATH"; exit 1; }
          test -f "$PLIST_PATH" || { echo "ERROR: IPA Info.plist missing at $PLIST_PATH"; exit 1; }
          test -f "$EXECUTABLE_PATH" || { echo "ERROR: IPA executable missing at $EXECUTABLE_PATH"; exit 1; }

          BUNDLE_IDENTIFIER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST_PATH")
          BUNDLE_EXECUTABLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$PLIST_PATH")
          echo "IPA CFBundleIdentifier: $BUNDLE_IDENTIFIER"
          echo "IPA CFBundleExecutable: $BUNDLE_EXECUTABLE"
          if [ -z "$BUNDLE_IDENTIFIER" ] || [[ "$BUNDLE_IDENTIFIER" == *'$('* ]] || [[ "$BUNDLE_IDENTIFIER" == *'%'* ]]; then
            echo "ERROR: IPA CFBundleIdentifier is empty or unresolved: $BUNDLE_IDENTIFIER"
            exit 1
          fi
          if [ "$BUNDLE_EXECUTABLE" != "IslandBrowser" ]; then
            echo "ERROR: IPA CFBundleExecutable must be IslandBrowser, got: $BUNDLE_EXECUTABLE"
            exit 1
          fi
          file "$EXECUTABLE_PATH"
          file "$EXECUTABLE_PATH" | grep -q 'Mach-O' || {
            echo "ERROR: IPA executable is not a Mach-O file"
            exit 1
          }

          if find ipa-validation -print | grep -Eq '%%1|%%1\.app|%25%251|%1|%%URL'; then
            echo "ERROR: IPA contains malformed placeholder paths"
            find ipa-validation -print
            exit 1
          fi
          find ipa-validation -print | sort

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: IslandBrowser-unsigned
          path: IslandBrowser.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IslandBrowser-build-log
          path: build/xcodebuild.log
