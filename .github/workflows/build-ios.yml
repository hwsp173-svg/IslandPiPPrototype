name: Build IslandBrowser

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Archive & Package IPA
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          echo "=== Installed Xcode installations ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          
          if [ -d "/Applications/Xcode_26.6.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          elif [ -d "/Applications/Xcode_26.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer
          else
            XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
            if [ -n "$XCODE_PATH" ]; then
              sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
            fi
          fi
          
          echo "=== Selected Xcode version ==="
          xcodebuild -version

      - name: Verify project and scheme
        run: |
          xcodebuild -project IslandPiPPrototype.xcodeproj -list

      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -project IslandPiPPrototype.xcodeproj \
            -scheme IslandPiPPrototype \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/IslandBrowser.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 2>&1 | tee build.log

      - name: Package IPA
        run: |
          APP_PATH="build/IslandBrowser.xcarchive/Products/Applications/IslandPiPPrototype.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::.app bundle not found at $APP_PATH"
            find build/IslandBrowser.xcarchive -type d -maxdepth 4
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry IslandBrowser.ipa Payload
          echo "=== Created IslandBrowser.ipa ==="
          ls -lh IslandBrowser.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: IslandBrowser-unsigned
          path: IslandBrowser.ipa
          retention-days: 90
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
