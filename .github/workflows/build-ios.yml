name: Build iOS (Unsigned IPA)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Archive & Package IPA
    runs-on: macos-26
    timeout-minutes: 30

    env:
      PROJECT: IslandPiPPrototype.xcodeproj
      SCHEME: IslandPiPPrototype
      CONFIGURATION: Release
      ARCHIVE_PATH: build/IslandPiPPrototype.xcarchive
      IPA_NAME: IslandPiPPrototype.ipa

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Discover available Xcode versions ─────────────────────
      - name: List installed Xcode versions
        run: |
          echo "=== All Xcode installations ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "No Xcode installations found"
          echo ""
          echo "=== Current default ==="
          xcode-select -p
          xcodebuild -version

      # ── 3. Select Xcode 26.6 (preferred) or newest 26.x ────────
      - name: Select Xcode 26
        run: |
          # Prefer Xcode 26.6 specifically
          if [ -d "/Applications/Xcode_26.6.app" ]; then
            XCODE_26="/Applications/Xcode_26.6.app"
            echo "Found preferred Xcode 26.6"
          else
            # Fall back to newest 26.x (but NOT 27.x)
            XCODE_26=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          fi

          if [ -z "$XCODE_26" ]; then
            echo "::error::No Xcode 26.x found on this runner. Available installations:"
            ls -d /Applications/Xcode*.app 2>/dev/null || echo "  (none)"
            exit 1
          fi

          echo "Selected: $XCODE_26"
          sudo xcode-select -s "$XCODE_26"

          # Verify we did NOT end up on Xcode 27
          XCODE_VER=$(xcodebuild -version | head -1)
          if echo "$XCODE_VER" | grep -q "Xcode 27"; then
            echo "::error::Selected Xcode 27 which is not permitted. Aborting."
            exit 1
          fi

      # ── 4. Print toolchain info ─────────────────────────────────
      - name: Print Xcode and SDK info
        run: |
          echo "=== Xcode version ==="
          xcodebuild -version
          echo ""
          echo "=== iOS SDKs ==="
          xcodebuild -showsdks | grep -i ios
          echo ""
          echo "=== Swift version ==="
          swift --version

      # ── 5. Verify project and scheme ────────────────────────────
      - name: Verify project and scheme
        run: |
          echo "=== Project targets ==="
          xcodebuild -project "$PROJECT" -list
          echo ""
          echo "=== Scheme build settings (key values) ==="
          xcodebuild -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -showBuildSettings \
            | grep -E '(PRODUCT_BUNDLE_IDENTIFIER|IPHONEOS_DEPLOYMENT_TARGET|ARCHS|SDKROOT|TARGETED_DEVICE_FAMILY|INFOPLIST_FILE|SWIFT_VERSION)'

      # ── 6. Build unsigned archive ───────────────────────────────
      - name: Archive for physical device (unsigned)
        run: |
          set -o pipefail

          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            ARCHS=arm64 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log

          echo ""
          echo "=== Archive contents ==="
          ls -la "$ARCHIVE_PATH/Products/Applications/" || true

      # ── 7. Package .app into .ipa ───────────────────────────────
      - name: Package IPA
        run: |
          APP_PATH="$ARCHIVE_PATH/Products/Applications/IslandPiPPrototype.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "::error::.app bundle not found at $APP_PATH"
            echo "Archive contents:"
            find "$ARCHIVE_PATH" -type d -maxdepth 4
            exit 1
          fi

          echo "=== .app bundle info ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PATH/Info.plist" || true
          echo ""

          # Sideloadly expects: IPA → Payload/YourApp.app
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -y "$IPA_NAME" Payload/

          echo "=== IPA created ==="
          ls -lh "$IPA_NAME"
          echo ""
          echo "=== IPA contents ==="
          unzip -l "$IPA_NAME" | head -20

      # ── 8. Upload IPA artifact ──────────────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: IslandPiPPrototype-unsigned
          path: ${{ env.IPA_NAME }}
          retention-days: 90
          if-no-files-found: error

      # ── 9. Upload build logs on failure ─────────────────────────
      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
          retention-days: 14
          if-no-files-found: ignore
